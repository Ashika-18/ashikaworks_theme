name: Deploy theme to Xserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy theme over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: "-avz --exclude=.git* --exclude=.github* --exclude=node_modules* --exclude=README.md --exclude=.DS_Store"
          remote_path: /home/${{ secrets.XSERVER_USER }}/ashikaworks.com/public_html/wp-content/themes/ashikaworks_theme/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_port: ${{ secrets.XSERVER_PORT }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_key_pass: ${{ secrets.XSERVER_PASSPHRASE }}
